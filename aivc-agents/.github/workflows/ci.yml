name: ci

# The whole pipeline runs against the offline provider: no API keys in CI, no spend, and
# deterministic results, so a red build is a real regression rather than model drift.

on:
  push:
    branches: [main]
  pull_request:

env:
  AIVC_PROVIDER: offline
  PYTHONPATH: src:.

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src agents tests scripts
      - name: Types
        run: mypy src/aivc
        continue-on-error: true   # advisory until the codebase is fully annotated
      - name: Tests
        run: pytest -q --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/

  evals:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      # The quality gate. Each suite declares its own thresholds and the command exits
      # non-zero when one is breached, so a prompt or retrieval change that degrades
      # citation validity, refusal correctness or least-privilege enforcement fails the PR.
      - name: Agent eval suites
        run: python -m aivc.cli eval all --repeats 3 --save reports --baseline baselines

      - name: Publish eval summary
        if: always()
        run: |
          {
            echo "## Agent eval results"
            for f in reports/*.json; do
              python - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          status = "PASS" if d["gate_passed"] else "FAIL"
          print(f"\n### {d['suite']} — {status}")
          print(f"- pass rate {d['pass_rate']:.0%}, consistency {d['consistency']:.0%} over {d['runs']} runs")
          for k, v in d["metrics"].items():
              print(f"- {k}: {v}")
          for b in d["gate_breaches"]:
              print(f"- BREACH {b}")
          PY
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aivc-agents:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name aivc -p 8000:8000 aivc-agents:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/healthz && break || sleep 2
          done
          curl -fs http://localhost:8000/readyz
          curl -fs -X POST http://localhost:8000/v1/policy/ask \
            -H 'content-type: application/json' -H 'X-User: ci' -H 'X-Roles: employee' \
            -d '{"question":"What mileage rate applies to the first 10,000 business miles?"}' \
            | grep -q "45 pence"
          docker rm -f aivc
